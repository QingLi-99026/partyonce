<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Events - 新首页预览 V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Playfair+Display:wght@400;700&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
        }
        
        /* ===== 星际探险主题 ===== */
        .theme-star {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a237e;
            --accent: #00d4ff;
            --glow: #00ffff;
            --text: #ffffff;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }
        
        .theme-star .home-container {
            background: radial-gradient(ellipse at 30% 20%, #1a3a5c 0%, #0a0e27 50%, #050714 100%);
        }
        
        .theme-star .main-title {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        
        .theme-star .theme-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 0, 0, 0.3));
            border: 2px solid rgba(0, 212, 255, 0.3);
            clip-path: polygon(10% 0%, 100% 0%, 100% 90%, 90% 100%, 0% 100%, 0% 10%);
        }
        
        .theme-star .theme-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }
        
        /* ===== 梦幻城堡主题 ===== */
        .theme-castle {
            --bg-primary: #2d1b4e;
            --bg-secondary: #e8d5f2;
            --accent: #ffd700;
            --glow: #fff8dc;
            --text: #ffffff;
            --font-title: 'Playfair Display', serif;
            --font-body: 'Cormorant Garamond', serif;
        }
        
        .theme-castle .home-container {
            background: radial-gradient(ellipse at 50% 30%, #e8d5f2 0%, #c9a0dc 30%, #2d1b4e 70%, #1a0f2e 100%);
        }
        
        .theme-castle .main-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        .theme-castle .theme-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px 20px 20px 0;
            position: relative;
        }
        
        .theme-castle .theme-card::before {
            content: '👑';
            position: absolute;
            top: -15px;
            right: -10px;
            font-size: 1.5rem;
        }
        
        .theme-castle .theme-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }
        
        /* ===== 森林奇境主题 ===== */
        .theme-forest {
            --bg-primary: #1a3d1a;
            --bg-secondary: #4a7c4e;
            --accent: #ffd700;
            --glow: #90ee90;
            --text: #ffffff;
            --font-title: 'Amatic SC', cursive;
            --font-body: 'Patrick Hand', cursive;
        }
        
        .theme-forest .home-container {
            background: radial-gradient(ellipse at 70% 80%, #4a7c4e 0%, #2d5a3d 40%, #1a3d1a 100%);
        }
        
        .theme-forest .main-title {
            font-family: 'Amatic SC', cursive;
            font-size: 4rem;
            letter-spacing: 0.05em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .theme-forest .theme-card {
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.3), rgba(0, 0, 0, 0.2));
            border: 3px solid #8b4513;
            border-radius: 10px;
            position: relative;
        }
        
        .theme-forest .theme-card::after {
            content: '🍃';
            position: absolute;
            bottom: -10px;
            left: 10px;
            font-size: 1.2rem;
        }
        
        .theme-forest .theme-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        /* ===== 通用样式 ===== */
        .home-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.5s ease;
        }
        
        .brand-layer {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 10;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }
        
        .tagline {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 0.5rem;
            letter-spacing: 0.1em;
        }
        
        .hero-content {
            text-align: center;
            z-index: 10;
            padding: 2rem;
        }
        
        .main-title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .sub-title {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            font-weight: 300;
        }
        
        .cta-button {
            padding: 1.2rem 3.5rem;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #1a1a1a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        
        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.5);
        }
        
        .theme-selector {
            position: absolute;
            bottom: 12%;
            display: flex;
            gap: 2.5rem;
            z-index: 10;
        }
        
        .theme-card {
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 180px;
            backdrop-filter: blur(10px);
        }
        
        .theme-card:hover {
            transform: translateY(-8px);
        }
        
        .theme-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.8rem;
        }
        
        .theme-card h3 {
            margin: 0.5rem 0;
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .theme-card p {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.85;
        }
        
        .voice-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
            font-size: 1rem;
        }
        
        .voice-button:hover {
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd700;
            transform: scale(1.05);
        }
        
        /* 粒子效果 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="home-container theme-star" id="homeContainer">
        <!-- 粒子效果 -->
        <div class="particles" id="particles"></div>
        
        <!-- 品牌层 -->
        <div class="brand-layer">
            <h1 class="logo">Party Events</h1>
            <p class="tagline">澳大利亚高端派对策划</p>
        </div>
        
        <!-- 主内容 -->
        <div class="hero-content">
            <h2 class="main-title">为TA打造专属派对</h2>
            <p class="sub-title">高端定制 · 主题场景 · 一站式服务</p>
            <button class="cta-button" onclick="alert('开始策划派对')">
                开始策划派对
            </button>
        </div>
        
        <!-- 主题选择 -->
        <div class="theme-selector">
            <div class="theme-card active" onclick="selectTheme('star')" data-theme="star">
                <span class="theme-icon">🚀</span>
                <h3>星际探险</h3>
                <p>适合小王子</p>
            </div>
            <div class="theme-card" onclick="selectTheme('castle')" data-theme="castle">
                <span class="theme-icon">🏰</span>
                <h3>梦幻城堡</h3>
                <p>适合小公主</p>
            </div>
            <div class="theme-card" onclick="selectTheme('forest')" data-theme="forest">
                <span class="theme-icon">🌲</span>
                <h3>森林奇境</h3>
                <p>适合小探险家</p>
            </div>
        </div>
        
        <!-- 语音按钮 -->
        <button class="voice-button" onclick="alert('语音引导')">
            <span>🎙️</span>
            <span>语音引导</span>
        </button>
    </div>
    
    <script>
        function selectTheme(themeId) {
            const container = document.getElementById('homeContainer');
            
            // 移除所有主题类
            container.classList.remove('theme-star', 'theme-castle', 'theme-forest');
            
            // 添加新主题类
            container.classList.add(`theme-${themeId}`);
            
            // 更新卡片状态
            document.querySelectorAll('.theme-card').forEach(card => {
                card.classList.remove('active');
            });
            document.querySelector(`[data-theme="${themeId}"]`).classList.add('active');
            
            // 重新生成粒子
            createParticles(themeId);
            
            console.log('切换到主题:', themeId);
        }
        
        function createParticles(themeId) {
            const container = document.getElementById('particles');
            container.innerHTML = '';
            
            const particleCount = 25;
            const colors = {
                star: ['rgba(0, 212, 255, 0.6)', 'rgba(255, 255, 255, 0.8)'],
                castle: ['rgba(255, 215, 0, 0.5)', 'rgba(255, 255, 255, 0.7)'],
                forest: ['rgba(144, 238, 144, 0.5)', 'rgba(255, 215, 0, 0.4)']
            };
            
            const themeColors = colors[themeId] || colors.star;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 4 + 2) + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = themeColors[Math.floor(Math.random() * themeColors.length)];
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        
        // 初始化
        createParticles('star');
    </script>
</body>
</html>
