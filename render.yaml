# Render Blueprint 配置
# Production hardening V1: blueprint is deployment-ready only after owner review.
# It intentionally disables auto deploy and requires secrets / database URL to be
# configured manually in Render. Do not use this file to deploy without the
# production launch runbook approval gate.

services:
  - type: web
    name: partyonce-prod
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
